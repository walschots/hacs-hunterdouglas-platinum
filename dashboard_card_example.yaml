# Compact blind card (Mushroom style): up / down, a hand button that swaps the
# buttons for a drag bar, plus a vanes toggle and a top-down toggle when the
# blind has them. Pick any of the blind's entities.
type: custom:hunterdouglas-platinum-card
entity: cover.parlor
name: Parlor          # optional
top_open: 10          # optional: how far the top-down button opens the top (%)
show_vanes: true      # optional
show_top: true        # optional

