# One blind. Pick any of the blind's entities; the card finds its bottom rail,
# middle rail and vanes and shows a vertical slider for each (like the Platinum App).
type: custom:hunterdouglas-platinum-card
entity: cover.mbr_bottom_rail
name: MBR                 # optional
slider_height: 170        # optional, in pixels

